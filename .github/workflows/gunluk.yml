name: Alphabot gunluk katilim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  gunluk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Penceredeki cekilislere katil
        run: python3 gunluk.py
        env:
          JOIN_BOT_TOKEN: ${{ secrets.JOIN_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHABOT_KEY_CHROME: ${{ secrets.ALPHABOT_KEY_CHROME }}
          ALPHABOT_API_KEY: ${{ secrets.ALPHABOT_API_KEY }}
          ALPHABOT_KEY_FIREFOX: ${{ secrets.ALPHABOT_KEY_FIREFOX }}
          ALPHABOT_KEY_BRAVE: ${{ secrets.ALPHABOT_KEY_BRAVE }}
          MAX_WINNERS: "0"
          HARIC: ""
