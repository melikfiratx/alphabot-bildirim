name: Alphabot otomatik katilim

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katilim
  cancel-in-progress: false

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Linkleri isle ve katil
        run: python3 katilim.py
        env:
          JOIN_BOT_TOKEN: ${{ secrets.JOIN_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHABOT_KEY_CHROME: ${{ secrets.ALPHABOT_KEY_CHROME }}
          ALPHABOT_API_KEY: ${{ secrets.ALPHABOT_API_KEY }}
          ALPHABOT_KEY_FIREFOX: ${{ secrets.ALPHABOT_KEY_FIREFOX }}
          ALPHABOT_KEY_BRAVE: ${{ secrets.ALPHABOT_KEY_BRAVE }}
